#------------------------------------------------------------------------------------



# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:class xwayland:1, match:float true

# 1. Automatically banish the tiny Windows 98 artifact
windowrule {
    name = banish-ba-artifact
    match:class = ^steam_app_3557620$
    match:title = ^\s*$
    float = true
    no_focus = true
    no_initial_focus = true
    size = 1 1
    opacity = 0 0
    move = 100% 100%
}

# 2. Force the actual game to tile and allow resizing
windowrule {
    name = force-tile-blue-archive
    match:class = ^steam_app_3557620$
    match:title = ^Blue Archive.*
    float = false
    no_max_size = true
    suppress_event = maximize fullscreen
}
