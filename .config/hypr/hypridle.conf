general {
    lock_cmd = pidof hyprlock || hyprlock          # dbus/sysd lock command (fired when loginctl lock-session is called)
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'     # to avoid having to press a key twice to turn on the display
}

# Dim screen (brightnessctl)
listener {
    timeout = 150                                  # 2.5 min
    on-timeout = brightnessctl -s set 10           # dim monitor backlight to minimum
    on-resume = brightnessctl -r                   # restore monitor backlight
}

# Lock screen
listener {
    timeout = 300                                  # 5 min
    on-timeout = loginctl lock-session             # lock screen when timeout has passed
}

# Turn off screen
listener {
    timeout = 330                                  # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'         # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'           # screen on when activity is detected
}

