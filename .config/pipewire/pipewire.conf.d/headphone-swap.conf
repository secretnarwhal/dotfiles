context.modules = [
{ name = libpipewire-module-filter-chain
    args = {
        node.description = "Headphones Swapped"
        media.name       = "Headphones Swapped"
        filter.graph = {
            nodes = [
                {
                    type   = builtin
                    name   = copy_l
                    plugin = copy
                    label  = copy
                }
                {
                    type   = builtin
                    name   = copy_r
                    plugin = copy
                    label  = copy
                }
            ]
            inputs  = [ "copy_l:In" "copy_r:In" ]
            outputs = [ "copy_r:Out" "copy_l:Out" ]
        }
        capture.props = {
            node.name      = "headphone_swap_sink"
            media.class    = "Audio/Sink"
            audio.position = [ FL FR ]
        }
        playback.props = {
            node.name      = "headphone_swap_playback"
            audio.position = [ FL FR ]
            node.target    = "alsa_output.pci-0000_04_00.6.HiFi__Headphones__sink"
            node.passive   = true
            node.autoconnect = true
        }
    }
}
]
